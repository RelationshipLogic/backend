name: CD

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/relationshiplogic/backend:latest

  deploy:
    needs: build
    runs-on: self-hosted   # 맥미니에 등록된 러너. Cloudflare Tunnel SSH 타임아웃 문제를 피하려고
                            # GitHub 클라우드에서 인바운드로 접속하는 대신 맥미니가 직접 작업을 받아온다.

    steps:
      - name: Deploy to rl-backend VM
        run: ssh rl-backend@orb 'cd ~/rl-backend && git pull && docker compose pull app && docker compose up -d app'
